name: iOS starter workflow

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Select iOS Simulator
        id: ios_sim
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "iOS"; then
            echo "No iOS runtimes installed. Downloading..."
            xcodebuild -downloadPlatform iOS
          fi

          runtime_id=$(xcrun simctl list runtimes -j | ruby -rjson -e 'data=JSON.parse(STDIN.read); ios=data["runtimes"].select { |r| r["identifier"].start_with?("com.apple.CoreSimulator.SimRuntime.iOS") && r["isAvailable"] }; runtime=ios.sort_by { |r| r["version"] }.last; puts runtime ? runtime["identifier"] : ""')
          if [ -z "$runtime_id" ]; then
            echo "No iOS runtime available after download."
            exit 1
          fi

          device_id=$(xcrun simctl list devices -j | ruby -rjson -e "data=JSON.parse(STDIN.read); runtime='$runtime_id'; devices=data['devices'][runtime] || []; dev=devices.find { |d| d['isAvailable'] && d['name'] =~ /iPhone/ }; puts dev ? dev['udid'] : ''")
          if [ -z "$device_id" ]; then
            device_type=$(xcrun simctl list devicetypes -j | ruby -rjson -e 'data=JSON.parse(STDIN.read); dev=data["devicetypes"].find { |d| d["name"] == "iPhone 15" } || data["devicetypes"].find { |d| d["name"] =~ /iPhone/ }; puts dev["identifier"]')
            device_id=$(xcrun simctl create "CI iPhone" "$device_type" "$runtime_id")
          fi

          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,id=${{ steps.ios_sim.outputs.device_id }}"
      - name: Test
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,id=${{ steps.ios_sim.outputs.device_id }}"
